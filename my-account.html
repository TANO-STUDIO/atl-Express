<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Alt Express</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --ink:#1a3a5c;
    --ink-soft:#1e4570;
    --paper:#ffffff;
    --paper-dim:#f4f7f6;
    --orange:#1F8578;
    --orange-deep:#16685E;
    --slate:#4a7fa5;
    --slate-light:#7aafd4;
    --sky:#e8f4fd;
    --green:#1F8578;
    --line: rgba(26,58,92,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0; max-width:100%;}
  html,body{overflow-x:hidden;}
  body{font-family:'Inter', sans-serif; color:var(--ink); background:var(--paper); line-height:1.5;}
  h1,h2,h3{font-family:'Space Grotesk', sans-serif; font-weight:600;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1000px; margin:0 auto; padding:0 24px;}

  @keyframes fadeUp{ from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }
  @keyframes popIn{ 0%{opacity:0; transform:scale(0.7);} 70%{transform:scale(1.06);} 100%{opacity:1; transform:scale(1);} }
  @keyframes floatSlow{ 0%,100%{transform:translateY(0) translateX(0);} 50%{transform:translateY(-8px) translateX(4px);} }
  @keyframes shimmer{ 0%{background-position:-200% 0;} 100%{background-position:200% 0;} }
  @keyframes spin{ to{transform:rotate(360deg);} }

  .reveal{opacity:0; transform:translateY(20px); transition:opacity 0.6s cubic-bezier(0.16,1,0.3,1), transform 0.6s cubic-bezier(0.16,1,0.3,1);}
  .reveal.in-view{opacity:1; transform:translateY(0);}

  .acct-header{background:#fff; border-bottom:1px solid var(--line); padding:16px 0; position:sticky; top:0; z-index:20;}
  .acct-header .wrap{display:flex; align-items:center; justify-content:space-between;}
  .acct-logo{display:flex; align-items:center; gap:10px; min-width:0; flex-shrink:1; overflow:hidden;}
  .acct-logo img{height:36px; width:auto; border-radius:5px; flex-shrink:0;}
  .acct-logo .name{font-family:'Space Grotesk'; font-weight:700; font-size:16px; white-space:nowrap;}
  .logout-btn{
    background:none; border:1px solid var(--line); border-radius:7px;
    padding:8px 16px; font-size:13.5px; font-weight:500; color:var(--ink); cursor:pointer;
    transition:background 0.2s ease, transform 0.2s ease; flex-shrink:0;
  }
  .logout-btn:hover{background:var(--sky); transform:translateY(-1px);}

  .profile-hero{ position:relative; margin-bottom:64px; }
  .profile-cover{
    height:150px; width:100%;
    background:linear-gradient(120deg, var(--ink) 0%, var(--ink-soft) 45%, var(--orange) 130%);
    position:relative; overflow:hidden;
  }
  .profile-cover::before, .profile-cover::after{
    content:''; position:absolute; border-radius:50%;
    background:rgba(255,255,255,0.12);
  }
  .profile-cover::before{ width:180px; height:180px; top:-90px; right:8%; animation: floatSlow 7s ease-in-out infinite; }
  .profile-cover::after{ width:110px; height:110px; bottom:-60px; left:14%; animation: floatSlow 9s ease-in-out infinite reverse; }

  .profile-info-bar{
    max-width:1000px; margin:0 auto; padding:0 24px;
    display:flex; align-items:flex-end; gap:20px;
    margin-top:-56px; position:relative; z-index:2;
    flex-wrap:wrap;
  }
  .profile-avatar{
    width:112px; height:112px; border-radius:50%;
    background:linear-gradient(135deg, var(--orange), var(--orange-deep));
    border:5px solid var(--paper);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'Space Grotesk'; font-weight:700; font-size:38px;
    flex-shrink:0; box-shadow:0 8px 24px rgba(26,58,92,0.18);
    animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.1s backwards;
  }
  .profile-identity{ padding-bottom:10px; flex:1; min-width:200px; }
  .profile-name{ font-size:24px; font-weight:700; margin-bottom:3px; }
  .profile-email{ font-size:13.5px; color:var(--slate); }
  .profile-join-date{ font-size:12.5px; color:var(--slate-light); margin-top:2px; }

  .profile-stats-row{ display:flex; gap:10px; padding-bottom:10px; flex-wrap:wrap; }
  .profile-stat-chip{
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:10px 16px; text-align:center; min-width:84px;
    transition:transform 0.25s cubic-bezier(0.16,1,0.3,1), box-shadow 0.25s ease;
  }
  .profile-stat-chip:hover{ transform:translateY(-3px); box-shadow:0 8px 20px rgba(26,58,92,0.1); }
  .profile-stat-chip .num{ font-family:'Space Grotesk'; font-weight:700; font-size:18px; color:var(--ink); }
  .profile-stat-chip .lbl{ font-size:10.5px; color:var(--slate-light); text-transform:uppercase; letter-spacing:0.03em; margin-top:1px; }

  @media(max-width:640px){
    .profile-info-bar{ flex-direction:column; align-items:flex-start; margin-top:-46px; }
    .profile-avatar{ width:92px; height:92px; font-size:32px; }
    .profile-stats-row{ width:100%; }
  }

  .loyalty-card{
    background:linear-gradient(135deg, var(--ink), var(--ink-soft)); color:#fff; border-radius:16px;
    padding:24px; margin-bottom:28px; position:relative; overflow:hidden;
  }
  .loyalty-card::after{
    content:''; position:absolute; top:-50px; right:-50px; width:160px; height:160px; border-radius:50%;
    background:radial-gradient(circle, rgba(232,98,44,0.28), transparent 70%); animation: floatSlow 6s ease-in-out infinite;
  }
  .loyalty-tier-badge{
    display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600;
    background:rgba(255,255,255,0.12); padding:6px 14px; border-radius:20px; margin-bottom:14px; position:relative;
  }
  .loyalty-points{font-family:'Space Grotesk'; font-weight:700; font-size:32px; margin-bottom:14px; position:relative;}
  .loyalty-points span{font-size:14px; font-weight:500; color:var(--slate-light);}
  .loyalty-progress-track{height:8px; background:rgba(255,255,255,0.15); border-radius:20px; overflow:hidden; margin-bottom:8px; position:relative;}
  .loyalty-progress-fill{height:100%; background:linear-gradient(90deg, var(--orange), #f5b876); border-radius:20px; width:0%; transition:width 1.2s cubic-bezier(0.16,1,0.3,1);}
  .loyalty-progress-label{font-size:12.5px; color:var(--slate-light); margin-bottom:14px; position:relative;}
  .loyalty-link{font-size:13px; color:#fff; font-weight:600; text-decoration:underline; position:relative;}

  .section-title{font-size:19px; margin:8px 0 16px; display:flex; align-items:center; gap:8px;}

  .booking-list{display:flex; flex-direction:column; gap:12px; margin-bottom:32px;}
  .booking-card{
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px;
    display:grid; grid-template-columns:auto 1fr auto; gap:20px; align-items:center;
    transition:transform 0.25s cubic-bezier(0.16,1,0.3,1), box-shadow 0.25s ease;
    animation: fadeUp 0.4s cubic-bezier(0.16,1,0.3,1) backwards;
  }
  .booking-card:hover{ transform:translateY(-3px); box-shadow:0 10px 26px rgba(26,58,92,0.09); }
  @media (max-width:640px){ .booking-card{grid-template-columns:1fr;} }
  .booking-ref{font-family:'Space Grotesk'; font-weight:700; font-size:16px;}
  .booking-ref .sub{font-size:11.5px; color:var(--slate-light); font-weight:400; margin-top:2px;}
  .booking-details{font-size:13.5px; color:var(--slate); line-height:1.7;}
  .booking-details strong{color:var(--ink);}
  .status-pill{
    display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:20px;
    font-size:12.5px; font-weight:600; background:rgba(232,98,44,0.13); color:var(--orange);
    white-space:nowrap;
  }
  .status-pill.delivered{background:rgba(47,143,91,0.15); color:var(--green);}
  .status-pill .dot{width:6px; height:6px; border-radius:50%; background:currentColor;}

  .empty-state{
    text-align:center; padding:48px 24px; color:var(--slate); background:#fff;
    border:1px solid var(--line); border-radius:12px; margin-bottom:32px;
  }
  .empty-state a{color:var(--orange); font-weight:600;}

  .loading-spinner{
    display:inline-block; width:22px; height:22px; border:3px solid var(--line);
    border-top-color:var(--orange); border-radius:50%; animation: spin 0.8s linear infinite;
  }

  .cta-row{text-align:center; padding:20px 0 56px;}
  .cta-row a{
    display:inline-block; background:var(--orange); color:#fff; padding:13px 30px;
    border-radius:8px; font-size:14.5px; font-weight:600; position:relative; overflow:hidden;
    transition:transform 0.2s ease, box-shadow 0.25s ease;
  }
  .cta-row a:hover{ transform:translateY(-3px); box-shadow:0 10px 24px rgba(232,98,44,0.3); }
  .cta-row a::after{
    content:''; position:absolute; top:0; left:0; right:0; bottom:0;
    background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
    background-size:200% 100%; animation: shimmer 3s ease-in-out infinite;
  }
</style>
</head>
<body>

<div class="acct-header">
  <div class="wrap">
    <a href="index.html" class="acct-logo">
      <img src="logo/home logo.jpeg" alt="Alt Express logo" onerror="this.style.display='none'">
      <div class="name">Alt Express</div>
    </a>
    <button class="logout-btn" id="logoutBtn">Sign out</button>
  </div>
</div>

<div class="profile-hero">
  <div class="profile-cover"></div>
  <div class="profile-info-bar">
    <div class="profile-avatar" id="profileAvatar">?</div>
    <div class="profile-identity">
      <div class="profile-name" id="profileName">Loading…</div>
      <div class="profile-email" id="profileEmail">—</div>
      <div class="profile-join-date" id="profileJoinDate"></div>
    </div>
    <div class="profile-stats-row">
      <div class="profile-stat-chip">
        <div class="num" id="statBookingCount">0</div>
        <div class="lbl">Shipments</div>
      </div>
      <div class="profile-stat-chip">
        <div class="num" id="statTier">🥉</div>
        <div class="lbl">Tier</div>
      </div>
      <div class="profile-stat-chip">
        <div class="num" id="statPoints">0</div>
        <div class="lbl">Points</div>
      </div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="loyalty-card reveal" id="loyaltyCard" style="display:none;">
    <div class="loyalty-tier-badge" id="loyaltyTierBadge">🥉 Bronze</div>
    <div class="loyalty-points" id="loyaltyPoints">0 <span>pts</span></div>
    <div class="loyalty-progress-track">
      <div class="loyalty-progress-fill" id="loyaltyProgressFill"></div>
    </div>
    <div class="loyalty-progress-label" id="loyaltyProgressLabel">$0 spent</div>
    <a href="alt-express-club.html" class="loyalty-link">View Club benefits →</a>
  </div>

  <div class="section-title reveal">📦 Your bookings</div>
  <div id="bookingList" class="booking-list">
    <div class="empty-state"><span class="loading-spinner"></span></div>
  </div>

  <div class="cta-row reveal">
    <a href="send-parcel.html">Send a new parcel</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const CUSTOMER_SUPABASE_URL = "https://iynlknwijrxtysinppwh.supabase.co";
  const CUSTOMER_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5bmxrbndpanJ4dHlzaW5wcHdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNzM0NzQsImV4cCI6MjEwMzk0OTQ3NH0.YK7lzQQWez2OG3uQTZKaOo-mI9oJQYrgHG0PomlwoMQ";
  const customerSupabase = window.supabase.createClient(CUSTOMER_SUPABASE_URL, CUSTOMER_SUPABASE_ANON_KEY);

  const statusLabels = {
    pending:'Pending', confirmed:'Confirmed', picked_up:'Picked Up',
    in_transit:'In Transit', delivered:'Delivered', cancelled:'Cancelled'
  };
  const tierEmoji = { bronze:'🥉', silver:'🥈', gold:'🥇' };

  function escapeHtml(str){
    if(str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function getInitials(name, email){
    if(name && name.trim()){
      const parts = name.trim().split(/\s+/);
      return parts.length > 1
        ? (parts[0][0] + parts[parts.length-1][0]).toUpperCase()
        : parts[0].slice(0,2).toUpperCase();
    }
    return (email || '?').slice(0,2).toUpperCase();
  }

  let currentUser = null;

  (async function init(){
    const { data } = await customerSupabase.auth.getSession();
    if(!data || !data.session){
      window.location.href = 'customer-login.html';
      return;
    }
    currentUser = data.session.user;

    const name = currentUser.user_metadata && currentUser.user_metadata.full_name;
    const displayName = name && name.trim() ? name.trim() : currentUser.email.split('@')[0];

    document.getElementById('profileName').textContent = displayName;
    document.getElementById('profileEmail').textContent = currentUser.email;
    document.getElementById('profileAvatar').textContent = getInitials(name, currentUser.email);

    if(currentUser.created_at){
      const joined = new Date(currentUser.created_at);
      document.getElementById('profileJoinDate').textContent =
        'Member since ' + joined.toLocaleDateString(undefined, { year:'numeric', month:'long' });
    }

    await loadBookings();
    await loadLoyalty();

    document.querySelectorAll('.reveal').forEach(function(el, i){
      setTimeout(function(){ el.classList.add('in-view'); }, i * 80);
    });
  })();

  document.getElementById('logoutBtn').addEventListener('click', async function(){
    await customerSupabase.auth.signOut();
    window.location.href = 'customer-login.html';
  });

  async function loadLoyalty(){
    const { data, error } = await customerSupabase
      .from('loyalty_accounts')
      .select('*')
      .eq('email', currentUser.email)
      .maybeSingle();

    if(error || !data){
      document.getElementById('statTier').textContent = '🥉';
      document.getElementById('statPoints').textContent = '0';
      return;
    }

    document.getElementById('statTier').textContent = tierEmoji[data.tier] || '🥉';
    document.getElementById('statPoints').textContent = Math.floor(data.points);

    const tierConfig = {
      bronze: { label: '🥉 Bronze', next: 300, nextLabel: 'Silver' },
      silver: { label: '🥈 Silver', next: 1000, nextLabel: 'Gold' },
      gold:   { label: '🥇 Gold', next: null, nextLabel: null }
    };
    const cfg = tierConfig[data.tier] || tierConfig.bronze;

    document.getElementById('loyaltyCard').style.display = 'block';
    document.getElementById('loyaltyTierBadge').textContent = cfg.label;
    document.getElementById('loyaltyPoints').innerHTML = Math.floor(data.points) + ' <span>pts</span>';

    if(cfg.next){
      const percent = Math.min((data.lifetime_spend / cfg.next) * 100, 100);
      document.getElementById('loyaltyProgressFill').style.width = percent + '%';
      document.getElementById('loyaltyProgressLabel').textContent =
        '$' + data.lifetime_spend.toFixed(0) + ' spent — $' + Math.max(cfg.next - data.lifetime_spend, 0).toFixed(0) + ' to ' + cfg.nextLabel;
    } else {
      document.getElementById('loyaltyProgressFill').style.width = '100%';
      document.getElementById('loyaltyProgressLabel').textContent = '$' + data.lifetime_spend.toFixed(0) + ' spent — top tier reached';
    }
  }

  async function loadBookings(){
    const listEl = document.getElementById('bookingList');
    const { data, error } = await customerSupabase
      .from('bookings')
      .select('*')
      .eq('receiver_email', currentUser.email)
      .order('created_at', { ascending: false });

    if(error){
      listEl.innerHTML = '<div class="empty-state">Could not load bookings: ' + escapeHtml(error.message) + '</div>';
      return;
    }

    document.getElementById('statBookingCount').textContent = data ? data.length : 0;

    if(!data || data.length === 0){
      listEl.innerHTML = '<div class="empty-state">You haven\'t booked any shipments yet. <a href="send-parcel.html">Send your first parcel</a>.</div>';
      return;
    }

    listEl.innerHTML = data.map(function(b, i){
      const ref = b.id.slice(0,8).toUpperCase();
      const statusText = statusLabels[b.status] || b.status;
      const statusClass = b.status === 'delivered' ? 'status-pill delivered' : 'status-pill';
      const booked = b.created_at ? new Date(b.created_at).toLocaleDateString() : '—';
      return '<div class="booking-card" style="animation-delay:' + (i * 0.06) + 's">' +
        '<div class="booking-ref">' + ref + '<div class="sub">' + booked + '</div></div>' +
        '<div class="booking-details">' +
          '<strong>To:</strong> ' + escapeHtml(b.destination_country) + '<br>' +
          '<strong>Weight:</strong> ' + escapeHtml(b.weight) + ' kg &nbsp;·&nbsp; <strong>Service:</strong> ' + escapeHtml(b.service_type) +
        '</div>' +
        '<span class="' + statusClass + '"><span class="dot"></span>' + statusText + '</span>' +
      '</div>';
    }).join('');
  }
</script>

</body>
</html>
