<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Alt Express</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --ink:#1a3a5c;
    --ink-soft:#1e4570;
    --paper:#F7F5F0;
    --paper-dim:#EFEBE2;
    --orange:#E8622C;
    --orange-deep:#C94F1F;
    --slate:#4a7fa5;
    --slate-light:#7aafd4;
    --sky:#e8f4fd;
    --green:#2F8F5B;
    --line: rgba(26,58,92,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0; max-width:100%;}
  html,body{overflow-x:hidden;}
  body{
    font-family:'Inter', sans-serif;
    color:var(--ink);
    background:var(--paper);
    line-height:1.5;
  }
  h1,h2,h3{font-family:'Space Grotesk', sans-serif; font-weight:600;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 24px;}

  /* Top bar */
  .admin-header{
    background:#fff; border-bottom:1px solid var(--line);
    padding:16px 0;
  }
  .admin-header .wrap{display:flex; align-items:center; justify-content:space-between;}
  .admin-logo{display:flex; align-items:center; gap:10px;}
  .admin-logo img{height:36px; width:auto; border-radius:5px;}
  .admin-logo .name{font-family:'Space Grotesk'; font-weight:700; font-size:16px;}
  .admin-logo .tag{font-size:10.5px; color:var(--slate);}
  .admin-user{display:flex; align-items:center; gap:16px; font-size:14px; color:var(--slate);}
  .logout-btn{
    background:none; border:1px solid var(--line); border-radius:7px;
    padding:8px 16px; font-size:13.5px; font-weight:500; color:var(--ink); cursor:pointer;
  }
  .logout-btn:hover{background:var(--sky);}

  /* Tabs */
  .tabs{display:flex; gap:4px; margin:28px 0 24px; border-bottom:1px solid var(--line);}
  .tab-btn{
    padding:12px 18px; font-size:14.5px; font-weight:600; color:var(--slate);
    border:none; background:none; cursor:pointer; border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .tab-btn.active{color:var(--ink); border-bottom-color:var(--orange);}

  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  /* Table */
  .data-table{width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .data-table th{
    text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--slate); padding:12px 14px; background:var(--paper-dim); border-bottom:1px solid var(--line);
  }
  .data-table td{padding:12px 14px; font-size:14px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .data-table tr:last-child td{border-bottom:none;}
  .table-scroll{overflow-x:auto;}

  .status-select{
    border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:13px;
    font-family:'Inter'; background:#fff; color:var(--ink);
  }
  .ref-code{font-family:'Space Grotesk'; font-weight:600; font-size:13px;}

  .save-btn{
    background:var(--ink); color:#fff; border:none; border-radius:6px;
    padding:6px 12px; font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .save-btn:hover{background:var(--ink-soft);}
  .save-btn:disabled{opacity:0.5; cursor:not-allowed;}

  .rate-input{
    width:80px; border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:13px;
  }

  .loading-msg, .empty-msg{padding:32px; text-align:center; color:var(--slate); font-size:14.5px;}

  .toast{
    position:fixed; bottom:24px; right:24px; z-index:999;
    background:var(--ink); color:#fff; padding:14px 20px; border-radius:8px;
    font-size:14px; box-shadow:0 8px 24px rgba(26,58,92,0.2);
    display:none;
  }
  .toast.error{background:#C83C3C;}

  .add-rate-form{
    display:grid; grid-template-columns:1.2fr 1.2fr 0.8fr 0.8fr 0.8fr 0.7fr auto; gap:10px;
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:20px;
    align-items:end;
  }
  @media (max-width:900px){ .add-rate-form{grid-template-columns:1fr 1fr; } }
  .add-rate-form .field{display:flex; flex-direction:column; gap:4px;}
  .add-rate-form label{font-size:11.5px; color:var(--slate); font-weight:500;}
  .add-rate-form input, .add-rate-form select{
    border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:13.5px;
  }

  /* ===== Animations ===== */
  @keyframes fadeUp { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  @keyframes slideDown { from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }
  @keyframes toastIn { from{opacity:0; transform:translateY(12px) scale(0.96);} to{opacity:1; transform:translateY(0) scale(1);} }
  @keyframes spin { to{ transform:rotate(360deg); } }

  .tab-panel.active{animation: fadeIn 0.3s ease;}
  .data-table tbody tr{animation: fadeUp 0.35s ease backwards;}
  .data-table tbody tr:nth-child(1){animation-delay:0.02s;}
  .data-table tbody tr:nth-child(2){animation-delay:0.05s;}
  .data-table tbody tr:nth-child(3){animation-delay:0.08s;}
  .data-table tbody tr:nth-child(4){animation-delay:0.11s;}
  .data-table tbody tr:nth-child(5){animation-delay:0.14s;}
  .data-table tbody tr:nth-child(n+6){animation-delay:0.16s;}
  .data-table tbody tr:hover{background:var(--paper-dim); transition:background 0.15s ease;}

  .save-btn{transition:background 0.2s ease, transform 0.15s ease;}
  .save-btn:active:not(:disabled){transform:scale(0.95);}

  .toast{animation: toastIn 0.3s cubic-bezier(0.34,1.56,0.64,1);}

  .spinner{
    display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,0.4);
    border-top-color:#fff; border-radius:50%; animation: spin 0.7s linear infinite; margin-right:6px; vertical-align:middle;
  }

  /* ===== Search / filter toolbar ===== */
  .toolbar{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px;
    animation: slideDown 0.3s ease;
  }
  .toolbar input[type="text"], .toolbar input[type="date"], .toolbar select{
    border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:13.5px;
    font-family:'Inter'; background:#fff; color:var(--ink); transition:border-color 0.2s ease;
  }
  .toolbar input[type="text"]{flex:1; min-width:180px;}
  .toolbar input:focus, .toolbar select:focus{outline:none; border-color:var(--orange);}
  .toolbar .clear-btn{
    background:none; border:1px solid var(--line); border-radius:8px; padding:9px 14px;
    font-size:13px; color:var(--slate); cursor:pointer; transition:background 0.2s ease;
  }
  .toolbar .clear-btn:hover{background:var(--paper-dim);}
  .result-count{font-size:12.5px; color:var(--slate-light); margin-bottom:10px;}

  /* ===== Pagination ===== */
  .pagination{
    display:flex; align-items:center; justify-content:center; gap:6px; margin-top:18px;
  }
  .page-btn{
    min-width:34px; height:34px; border:1px solid var(--line); border-radius:7px; background:#fff;
    font-size:13.5px; font-weight:500; color:var(--ink); cursor:pointer; transition:all 0.2s ease;
    display:flex; align-items:center; justify-content:center; padding:0 8px;
  }
  .page-btn:hover:not(:disabled){background:var(--paper-dim); transform:translateY(-1px);}
  .page-btn.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .page-btn:disabled{opacity:0.4; cursor:not-allowed;}

  /* ===== Admin profile hero ===== */
  @keyframes popIn{ 0%{opacity:0; transform:scale(0.7);} 70%{transform:scale(1.06);} 100%{opacity:1; transform:scale(1);} }
  @keyframes floatSlow{ 0%,100%{transform:translateY(0) translateX(0);} 50%{transform:translateY(-8px) translateX(4px);} }

  .admin-hero{ position:relative; margin-bottom:60px; }
  .admin-cover{
    height:130px; width:100%;
    background:linear-gradient(120deg, var(--ink) 0%, var(--ink-soft) 50%, #2d5f8a 130%);
    position:relative; overflow:hidden;
  }
  .admin-cover::before, .admin-cover::after{
    content:''; position:absolute; border-radius:50%; background:rgba(255,255,255,0.1);
  }
  .admin-cover::before{ width:160px; height:160px; top:-80px; right:10%; animation: floatSlow 7s ease-in-out infinite; }
  .admin-cover::after{ width:100px; height:100px; bottom:-55px; left:16%; animation: floatSlow 9s ease-in-out infinite reverse; }

  .admin-info-bar{
    max-width:1180px; margin:0 auto; padding:0 24px;
    display:flex; align-items:flex-end; gap:20px;
    margin-top:-48px; position:relative; z-index:2; flex-wrap:wrap;
  }
  .admin-avatar{
    width:96px; height:96px; border-radius:50%;
    background:linear-gradient(135deg, var(--ink), var(--ink-soft));
    border:5px solid var(--paper);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'Space Grotesk'; font-weight:700; font-size:32px;
    flex-shrink:0; box-shadow:0 8px 24px rgba(26,58,92,0.18);
    animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.1s backwards;
  }
  .admin-identity{ padding-bottom:8px; flex:1; min-width:180px; }
  .admin-identity .role-badge{
    display:inline-block; background:var(--orange); color:#fff; font-size:10.5px; font-weight:700;
    padding:3px 9px; border-radius:10px; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:4px;
  }
  .admin-identity .name{ font-size:20px; font-weight:700; }
  .admin-identity .email{ font-size:13px; color:var(--slate); }

  .admin-stats-row{ display:flex; gap:10px; padding-bottom:8px; flex-wrap:wrap; }
  .admin-stat-chip{
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:9px 15px; text-align:center; min-width:78px;
    transition:transform 0.25s cubic-bezier(0.16,1,0.3,1), box-shadow 0.25s ease;
  }
  .admin-stat-chip:hover{ transform:translateY(-3px); box-shadow:0 8px 20px rgba(26,58,92,0.1); }
  .admin-stat-chip .num{ font-family:'Space Grotesk'; font-weight:700; font-size:17px; color:var(--ink); }
  .admin-stat-chip .lbl{ font-size:10px; color:var(--slate-light); text-transform:uppercase; letter-spacing:0.03em; margin-top:1px; }

  @media(max-width:640px){
    .admin-info-bar{ flex-direction:column; align-items:flex-start; margin-top:-40px; }
    .admin-avatar{ width:80px; height:80px; font-size:26px; }
    .admin-stats-row{ width:100%; }
  }
</style>
</head>
<body>

<div class="admin-header">
  <div class="wrap">
    <div class="admin-logo">
      <img src="logo/home logo.jpeg" alt="Alt Express logo" onerror="this.style.display='none'">
      <div>
        <div class="name">Alt Express</div>
        <div class="tag">admin dashboard</div>
      </div>
    </div>
    <button class="logout-btn" id="logoutBtn">Sign out</button>
  </div>
</div>

<div class="admin-hero">
  <div class="admin-cover"></div>
  <div class="admin-info-bar">
    <div class="admin-avatar" id="adminAvatar">?</div>
    <div class="admin-identity">
      <div class="role-badge">Staff</div>
      <div class="name" id="adminName">Loading…</div>
      <div class="email" id="userEmail">—</div>
    </div>
    <div class="admin-stats-row">
      <div class="admin-stat-chip">
        <div class="num" id="statTotalBookings">0</div>
        <div class="lbl">Bookings</div>
      </div>
      <div class="admin-stat-chip">
        <div class="num" id="statPendingBookings">0</div>
        <div class="lbl">Pending</div>
      </div>
      <div class="admin-stat-chip">
        <div class="num" id="statTotalRates">0</div>
        <div class="lbl">Rates</div>
      </div>
      <div class="admin-stat-chip">
        <div class="num" id="statTotalQuotes">0</div>
        <div class="lbl">Quotes</div>
      </div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="tabs">
    <button class="tab-btn active" data-tab="bookings">Bookings</button>
    <button class="tab-btn" data-tab="quotes">Quotes</button>
    <button class="tab-btn" data-tab="rates">Rate Table</button>
  </div>

  <!-- BOOKINGS -->
  <div class="tab-panel active" id="panel-bookings">
    <div class="toolbar">
      <input type="text" id="bookingSearch" placeholder="Search by reference, sender, or receiver…">
      <select id="bookingStatusFilter">
        <option value="">All statuses</option>
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="picked_up">Picked Up</option>
        <option value="in_transit">In Transit</option>
        <option value="delivered">Delivered</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <input type="date" id="bookingDateFrom" title="From date">
      <input type="date" id="bookingDateTo" title="To date">
      <button class="clear-btn" id="clearBookingFilters">Clear filters</button>
    </div>
    <div class="result-count" id="bookingResultCount"></div>
    <div class="table-scroll">
      <table class="data-table">
        <thead>
          <tr>
            <th>Ref</th>
            <th>Sender</th>
            <th>Receiver</th>
            <th>Destination</th>
            <th>Weight</th>
            <th>Service</th>
            <th>Status</th>
            <th>Booked</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="bookingsBody">
          <tr><td colspan="9" class="loading-msg">Loading bookings…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination" id="bookingsPagination"></div>
  </div>

  <!-- QUOTES -->
  <div class="tab-panel" id="panel-quotes">
    <div class="table-scroll">
      <table class="data-table">
        <thead>
          <tr>
            <th>Origin</th>
            <th>Destination</th>
            <th>Weight</th>
            <th>Rate</th>
            <th>Email</th>
            <th>Requested</th>
          </tr>
        </thead>
        <tbody id="quotesBody">
          <tr><td colspan="6" class="loading-msg">Loading quotes…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- RATES -->
  <div class="tab-panel" id="panel-rates">
    <div class="add-rate-form">
      <div class="field">
        <label>Origin</label>
        <input id="newOrigin" type="text" placeholder="United States">
      </div>
      <div class="field">
        <label>Destination</label>
        <input id="newDestination" type="text" placeholder="France">
      </div>
      <div class="field">
        <label>Min kg</label>
        <input id="newWeightMin" type="number" step="0.1" placeholder="0">
      </div>
      <div class="field">
        <label>Max kg</label>
        <input id="newWeightMax" type="number" step="0.1" placeholder="1">
      </div>
      <div class="field">
        <label>Price</label>
        <input id="newPrice" type="number" step="0.01" placeholder="18.50">
      </div>
      <div class="field">
        <label>Currency</label>
        <select id="newCurrency">
          <option>USD</option>
          <option>EUR</option>
          <option>GBP</option>
        </select>
      </div>
      <button class="save-btn" id="addRateBtn" style="padding:9px 16px;">Add rate</button>
    </div>

    <div class="toolbar">
      <input type="text" id="rateSearch" placeholder="Search by origin or destination…">
      <button class="clear-btn" id="clearRateFilters">Clear search</button>
    </div>
    <div class="result-count" id="rateResultCount"></div>

    <div class="table-scroll">
      <table class="data-table">
        <thead>
          <tr>
            <th>Origin</th>
            <th>Destination</th>
            <th>Min kg</th>
            <th>Max kg</th>
            <th>Price</th>
            <th>Currency</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="ratesBody">
          <tr><td colspan="7" class="loading-msg">Loading rates…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination" id="ratesPagination"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const ADMIN_SUPABASE_URL = "https://iynlknwijrxtysinppwh.supabase.co";
  const ADMIN_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5bmxrbndpanJ4dHlzaW5wcHdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNzM0NzQsImV4cCI6MjEwMzk0OTQ3NH0.YK7lzQQWez2OG3uQTZKaOo-mI9oJQYrgHG0PomlwoMQ";
  const adminSupabase = window.supabase.createClient(ADMIN_SUPABASE_URL, ADMIN_SUPABASE_ANON_KEY);

  const statusOptions = ['pending','confirmed','picked_up','in_transit','delivered','cancelled'];
  const statusLabels = {
    pending:'Pending', confirmed:'Confirmed', picked_up:'Picked Up',
    in_transit:'In Transit', delivered:'Delivered', cancelled:'Cancelled'
  };

  function showToast(message, isError){
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast' + (isError ? ' error' : '');
    toast.style.display = 'block';
    setTimeout(function(){ toast.style.display = 'none'; }, 3200);
  }

  function escapeHtml(str){
    if(str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function getInitials(email){
    return (email || '?').slice(0,2).toUpperCase();
  }

  function updateHeaderStats(){
    document.getElementById('statTotalBookings').textContent = allBookings.length;
    document.getElementById('statPendingBookings').textContent =
      allBookings.filter(function(b){ return b.status === 'pending'; }).length;
    document.getElementById('statTotalRates').textContent = allRates.length;
    document.getElementById('statTotalQuotes').textContent = allQuotes.length;
  }

  // ---------- Auth guard ----------
  (async function guardPage(){
    const { data } = await adminSupabase.auth.getSession();
    if(!data || !data.session){
      window.location.href = 'admin-login.html';
      return;
    }
    const email = data.session.user.email;
    document.getElementById('userEmail').textContent = email;
    document.getElementById('adminName').textContent = email.split('@')[0];
    document.getElementById('adminAvatar').textContent = getInitials(email);

    await Promise.all([loadBookings(), loadQuotes(), loadRates()]);
    updateHeaderStats();
  })();

  document.getElementById('logoutBtn').addEventListener('click', async function(){
    await adminSupabase.auth.signOut();
    window.location.href = 'admin-login.html';
  });

  // ---------- Tabs ----------
  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
      document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ---------- Bookings ----------
  let allBookings = [];
  let bookingsPage = 1;
  const BOOKINGS_PER_PAGE = 8;

  async function loadBookings(){
    const body = document.getElementById('bookingsBody');
    body.innerHTML = '<tr><td colspan="9" class="loading-msg">Loading bookings…</td></tr>';

    const { data, error } = await adminSupabase
      .from('bookings')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(500);

    if(error){
      body.innerHTML = '<tr><td colspan="9" class="empty-msg">Error loading bookings: ' + escapeHtml(error.message) + '</td></tr>';
      return;
    }

    allBookings = data || [];
    bookingsPage = 1;
    renderBookings();
  }

  function getFilteredBookings(){
    const search = document.getElementById('bookingSearch').value.trim().toLowerCase();
    const statusFilter = document.getElementById('bookingStatusFilter').value;
    const dateFrom = document.getElementById('bookingDateFrom').value;
    const dateTo = document.getElementById('bookingDateTo').value;

    return allBookings.filter(function(b){
      if(search){
        const ref = b.id.slice(0,8).toLowerCase();
        const haystack = (ref + ' ' + (b.sender_name||'') + ' ' + (b.receiver_name||'')).toLowerCase();
        if(haystack.indexOf(search) === -1) return false;
      }
      if(statusFilter && b.status !== statusFilter) return false;
      if(dateFrom){
        const bookedDate = b.created_at ? b.created_at.slice(0,10) : '';
        if(bookedDate < dateFrom) return false;
      }
      if(dateTo){
        const bookedDate = b.created_at ? b.created_at.slice(0,10) : '';
        if(bookedDate > dateTo) return false;
      }
      return true;
    });
  }

  function renderBookings(){
    const body = document.getElementById('bookingsBody');
    const countEl = document.getElementById('bookingResultCount');
    const filtered = getFilteredBookings();

    countEl.textContent = filtered.length + (filtered.length === 1 ? ' booking found' : ' bookings found');

    if(filtered.length === 0){
      body.innerHTML = '<tr><td colspan="9" class="empty-msg">No bookings match your filters.</td></tr>';
      renderPagination('bookingsPagination', 1, 1, function(){});
      return;
    }

    const totalPages = Math.max(1, Math.ceil(filtered.length / BOOKINGS_PER_PAGE));
    if(bookingsPage > totalPages) bookingsPage = totalPages;
    const start = (bookingsPage - 1) * BOOKINGS_PER_PAGE;
    const pageItems = filtered.slice(start, start + BOOKINGS_PER_PAGE);

    body.innerHTML = pageItems.map(function(b){
      const ref = b.id.slice(0,8).toUpperCase();
      const options = statusOptions.map(function(s){
        return '<option value="' + s + '"' + (s === b.status ? ' selected' : '') + '>' + statusLabels[s] + '</option>';
      }).join('');
      const booked = b.created_at ? new Date(b.created_at).toLocaleDateString() : '—';
      return '<tr data-id="' + b.id + '">' +
        '<td class="ref-code">' + ref + '</td>' +
        '<td>' + escapeHtml(b.sender_name) + '</td>' +
        '<td>' + escapeHtml(b.receiver_name) + '</td>' +
        '<td>' + escapeHtml(b.destination_country) + '</td>' +
        '<td>' + escapeHtml(b.weight) + ' kg</td>' +
        '<td>' + escapeHtml(b.service_type) + '</td>' +
        '<td><select class="status-select">' + options + '</select></td>' +
        '<td>' + booked + '</td>' +
        '<td><button class="save-btn">Save</button></td>' +
        '</tr>';
    }).join('');

    body.querySelectorAll('tr').forEach(function(row){
      const saveBtn = row.querySelector('.save-btn');
      const select = row.querySelector('.status-select');
      saveBtn.addEventListener('click', async function(){
        const id = row.getAttribute('data-id');
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span class="spinner"></span>Saving...';
        const { error } = await adminSupabase.from('bookings').update({ status: select.value }).eq('id', id);
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save';
        if(error){
          showToast('Failed to update: ' + error.message, true);
        } else {
          showToast('Booking status updated.');
          const b = allBookings.find(function(x){ return x.id === id; });
          if(b) b.status = select.value;
          updateHeaderStats();
        }
      });
    });

    renderPagination('bookingsPagination', bookingsPage, totalPages, function(newPage){
      bookingsPage = newPage;
      renderBookings();
    });
  }

  ['bookingSearch','bookingStatusFilter','bookingDateFrom','bookingDateTo'].forEach(function(id){
    document.getElementById(id).addEventListener('input', function(){
      bookingsPage = 1;
      renderBookings();
    });
  });
  document.getElementById('clearBookingFilters').addEventListener('click', function(){
    document.getElementById('bookingSearch').value = '';
    document.getElementById('bookingStatusFilter').value = '';
    document.getElementById('bookingDateFrom').value = '';
    document.getElementById('bookingDateTo').value = '';
    bookingsPage = 1;
    renderBookings();
  });

  // ---------- Shared pagination renderer ----------
  function renderPagination(containerId, currentPage, totalPages, onChange){
    const container = document.getElementById(containerId);
    if(totalPages <= 1){ container.innerHTML = ''; return; }

    let html = '';
    html += '<button class="page-btn" data-page="prev"' + (currentPage === 1 ? ' disabled' : '') + '>‹</button>';
    for(let i = 1; i <= totalPages; i++){
      html += '<button class="page-btn' + (i === currentPage ? ' active' : '') + '" data-page="' + i + '">' + i + '</button>';
    }
    html += '<button class="page-btn" data-page="next"' + (currentPage === totalPages ? ' disabled' : '') + '>›</button>';
    container.innerHTML = html;

    container.querySelectorAll('.page-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        const val = btn.dataset.page;
        if(val === 'prev'){ onChange(Math.max(1, currentPage - 1)); }
        else if(val === 'next'){ onChange(Math.min(totalPages, currentPage + 1)); }
        else { onChange(parseInt(val, 10)); }
      });
    });
  }

  // ---------- Quotes ----------
  let allQuotes = [];

  async function loadQuotes(){
    const body = document.getElementById('quotesBody');
    body.innerHTML = '<tr><td colspan="6" class="loading-msg">Loading quotes…</td></tr>';

    const { data, error } = await adminSupabase
      .from('quotes')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(200);

    if(error){
      body.innerHTML = '<tr><td colspan="6" class="empty-msg">Error loading quotes: ' + escapeHtml(error.message) + '</td></tr>';
      return;
    }

    allQuotes = data || [];

    if(!data || data.length === 0){
      body.innerHTML = '<tr><td colspan="6" class="empty-msg">No quotes requested yet.</td></tr>';
      return;
    }

    body.innerHTML = data.map(function(q){
      const requested = q.created_at ? new Date(q.created_at).toLocaleDateString() : '—';
      const rate = q.calculated_rate ? (q.currency || 'USD') + ' ' + Number(q.calculated_rate).toFixed(2) : '—';
      return '<tr>' +
        '<td>' + escapeHtml(q.origin) + '</td>' +
        '<td>' + escapeHtml(q.destination) + '</td>' +
        '<td>' + escapeHtml(q.weight) + ' kg</td>' +
        '<td>' + rate + '</td>' +
        '<td>' + escapeHtml(q.email || '—') + '</td>' +
        '<td>' + requested + '</td>' +
        '</tr>';
    }).join('');
  }

  // ---------- Rates ----------
  let allRates = [];
  let ratesPage = 1;
  const RATES_PER_PAGE = 8;

  async function loadRates(){
    const body = document.getElementById('ratesBody');
    body.innerHTML = '<tr><td colspan="7" class="loading-msg">Loading rates…</td></tr>';

    const { data, error } = await adminSupabase
      .from('rate_table')
      .select('*')
      .order('origin', { ascending: true })
      .limit(500);

    if(error){
      body.innerHTML = '<tr><td colspan="7" class="empty-msg">Error loading rates: ' + escapeHtml(error.message) + '</td></tr>';
      return;
    }

    allRates = data || [];
    ratesPage = 1;
    renderRates();
  }

  function getFilteredRates(){
    const search = document.getElementById('rateSearch').value.trim().toLowerCase();
    if(!search) return allRates;
    return allRates.filter(function(r){
      const haystack = ((r.origin||'') + ' ' + (r.destination||'')).toLowerCase();
      return haystack.indexOf(search) !== -1;
    });
  }

  function renderRates(){
    const body = document.getElementById('ratesBody');
    const countEl = document.getElementById('rateResultCount');
    const filtered = getFilteredRates();

    countEl.textContent = filtered.length + (filtered.length === 1 ? ' rate found' : ' rates found');

    if(filtered.length === 0){
      body.innerHTML = '<tr><td colspan="7" class="empty-msg">No rates match your search.</td></tr>';
      renderPagination('ratesPagination', 1, 1, function(){});
      return;
    }

    const totalPages = Math.max(1, Math.ceil(filtered.length / RATES_PER_PAGE));
    if(ratesPage > totalPages) ratesPage = totalPages;
    const start = (ratesPage - 1) * RATES_PER_PAGE;
    const pageItems = filtered.slice(start, start + RATES_PER_PAGE);

    body.innerHTML = pageItems.map(function(r){
      return '<tr data-id="' + r.id + '">' +
        '<td>' + escapeHtml(r.origin) + '</td>' +
        '<td>' + escapeHtml(r.destination) + '</td>' +
        '<td>' + escapeHtml(r.weight_min) + '</td>' +
        '<td>' + escapeHtml(r.weight_max) + '</td>' +
        '<td><input class="rate-input" type="number" step="0.01" value="' + r.price + '"></td>' +
        '<td>' + escapeHtml(r.currency) + '</td>' +
        '<td>' +
          '<button class="save-btn save-rate-btn">Save</button> ' +
          '<button class="save-btn delete-rate-btn" style="background:#C83C3C;">Delete</button>' +
        '</td>' +
        '</tr>';
    }).join('');

    body.querySelectorAll('tr').forEach(function(row){
      const id = row.getAttribute('data-id');
      const priceInput = row.querySelector('.rate-input');
      const saveBtn = row.querySelector('.save-rate-btn');
      const deleteBtn = row.querySelector('.delete-rate-btn');

      saveBtn.addEventListener('click', async function(){
        const newPrice = parseFloat(priceInput.value);
        if(isNaN(newPrice) || newPrice < 0){
          showToast('Enter a valid price.', true);
          return;
        }
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span class="spinner"></span>Saving...';
        const { error } = await adminSupabase.from('rate_table').update({ price: newPrice }).eq('id', id);
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save';
        if(error){
          showToast('Failed to update rate: ' + error.message, true);
        } else {
          showToast('Rate updated.');
          const r = allRates.find(function(x){ return x.id === id; });
          if(r) r.price = newPrice;
        }
      });

      deleteBtn.addEventListener('click', async function(){
        if(!confirm('Delete this rate row? This cannot be undone.')) return;
        deleteBtn.disabled = true;
        const { error } = await adminSupabase.from('rate_table').delete().eq('id', id);
        if(error){
          showToast('Failed to delete: ' + error.message, true);
          deleteBtn.disabled = false;
        } else {
          showToast('Rate deleted.');
          await loadRates();
          updateHeaderStats();
        }
      });
    });

    renderPagination('ratesPagination', ratesPage, totalPages, function(newPage){
      ratesPage = newPage;
      renderRates();
    });
  }

  document.getElementById('rateSearch').addEventListener('input', function(){
    ratesPage = 1;
    renderRates();
  });
  document.getElementById('clearRateFilters').addEventListener('click', function(){
    document.getElementById('rateSearch').value = '';
    ratesPage = 1;
    renderRates();
  });

  document.getElementById('addRateBtn').addEventListener('click', async function(){
    const origin = document.getElementById('newOrigin').value.trim();
    const destination = document.getElementById('newDestination').value.trim();
    const weightMin = parseFloat(document.getElementById('newWeightMin').value);
    const weightMax = parseFloat(document.getElementById('newWeightMax').value);
    const price = parseFloat(document.getElementById('newPrice').value);
    const currency = document.getElementById('newCurrency').value;

    if(!origin || !destination || isNaN(weightMin) || isNaN(weightMax) || isNaN(price)){
      showToast('Fill in all fields with valid values.', true);
      return;
    }

    const btn = document.getElementById('addRateBtn');
    btn.disabled = true;
    btn.textContent = 'Adding...';

    const { error } = await adminSupabase.from('rate_table').insert({
      origin: origin, destination: destination,
      weight_min: weightMin, weight_max: weightMax,
      price: price, currency: currency
    });

    btn.disabled = false;
    btn.textContent = 'Add rate';

    if(error){
      showToast('Failed to add rate: ' + error.message, true);
    } else {
      showToast('Rate added.');
      document.getElementById('newOrigin').value = '';
      document.getElementById('newDestination').value = '';
      document.getElementById('newWeightMin').value = '';
      document.getElementById('newWeightMax').value = '';
      document.getElementById('newPrice').value = '';
      await loadRates();
      updateHeaderStats();
    }
  });
</script>

</body>
